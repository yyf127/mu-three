<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MU Online · Three.js H5 演示</title>
    <script type="module" crossorigin src="/mu-three/assets/index-vhgRw-za.js"></script>
    <link rel="stylesheet" crossorigin href="/mu-three/assets/index-D1qEp4CJ.css">
  </head>
  <body>
    <!-- 固定 4:3 舞台：随窗口等比缩放 -->
    <div id="stage">
      <div id="app"></div>

      <!--
        水下滤镜：亚特兰蒂斯非安全区时整屏压一层蓝绿（原版 Terrain_Render 的
        color_underwater）。纯 DOM 一层比后处理便宜得多，也不影响拾取
        （pointer-events: none）。
      -->
      <div id="water-tint"></div>

      <!--
        登录界面 —— 用 `Data/Logo` 的原版图：
          back1.OZJ        背景
          Logo.ozj         MU 金属标志（256×128）
          0account_new.ozt 账号面板（250×216，源码 `Scene_Login` 的 `GL_DrawTexture(0xc,…)`）
          0text_box.ozj    输入框底（124×16）
          0on_botton.ozj   OK 按钮（70×19）
          0on_botton2.ozj  取消按钮（70×20）
        尺寸/位置都按源码的 640×480 逻辑坐标换算成百分比（#stage 恒为 4:3）。
      -->
      <div id="login" class="screen mu-screen">
        <div class="mu-bg" id="mu-login-bg"></div>
        <!-- 3D 背景：y=80..400 的 640×320 横条（源码 GL_BeginViewport），由 loginScene.ts 建 canvas -->
        <div id="login-3d"></div>

        <!--
          640×480 逻辑层：坐标直接照搬 `Scene_Login.cpp`，整层 `scale()` 到舞台。
          这样「一个数就是一个像素」，不会再出现百分比换算和字号缩放对不上的错位。
        -->
        <div class="mu-layer" id="login-layer">
          <div class="mu-title" id="mu-login-logo"></div>

          <div class="mu-panel" id="mu-account-panel">
            <label class="mu-label mu-acc-label" for="login-account">账号</label>
            <input id="login-account" class="mu-input mu-acc-input" value="1234" autocomplete="username" spellcheck="false" />

            <label class="mu-label mu-pw-label" for="login-password">密码</label>
            <input id="login-password" class="mu-input mu-pw-input" type="password" value="1234" autocomplete="current-password" />

            <button id="btn-login" class="mu-btn mu-ok">进入游戏</button>
            <!--
              第二个按钮 = 原版的「取消」位（`0on_botton2.ozj`）。
              网页端关不掉标签页，所以退回「选择线路」这一步；
              文案由 `main.ts` 用 `Text.bmd[381]`「结束游戏」填。
              （以前这里是「离线演示」，现在挪到 `/demo` 页面走完整流程）
            -->
            <button id="btn-quit" class="mu-btn mu-cancel">结束游戏</button>
          </div>

          <div class="mu-version" id="login-msg">MU Online · 0.97</div>
          <div class="mu-foot-left">Version: 0.97k · H5</div>
          <div class="mu-foot-right">双击 启动游戏.bat 拉起服务端</div>
        </div>
      </div>

      <!--
        选角界面 —— 原版是一整屏 3D：背景模型 `Data/Logo/Logo05.bmd`（0xA4 槽，
        内部名 main.smd），前面站着角色，四周套一圈 `Interface01..04` 的框。
        源码 `Scene_CharSelect.cpp` + `Render/Scene_CharPreview.cpp::FUN_005239a0`：
          框  0xC Interface01 256×86  → (64,0) 和 (320,0)（右半镜像）
              0xD Interface02  64×256 → (0,0) 和 (576,0)
              0xE Interface03  64×224 → (0,256) 和 (576,256)
              0xF Interface04 256×32  → (64,448) 和 (320,448)
          新建 0x10 New_character201 199×109 → (221, 6)，悬停标签 0x11 (286,81) 70×25
          删除 0x12 Delete01 205×88 → (0,116)，按钮 0x13 (128,148) 70×19
          进入 0x14 Ok01     205×88 → (434,116)，按钮 0x15 (441,148) 70×19
        角色名字原版是画在 3D 角色头顶的；我们没有选角 3D 角色，先做成中间那一列名单。
      -->
      <div id="charselect" class="screen hidden mu-screen">
        <div class="mu-bg" id="mu-char-bg"></div>
        <div id="char-3d"></div>

        <div class="mu-layer" id="char-layer">
          <!-- 四周的框（左右各镜像一份） -->
          <div class="cf flip" id="cf-top-l"></div>
          <div class="cf" id="cf-top-r"></div>
          <div class="cf flip" id="cf-left-1"></div>
          <div class="cf" id="cf-right-1"></div>
          <div class="cf flip" id="cf-left-2"></div>
          <div class="cf" id="cf-right-2"></div>
          <div class="cf flip" id="cf-bot-l"></div>
          <div class="cf" id="cf-bot-r"></div>

          <!-- 三块原版銘牌：新建 / 删除 / 进入，悬停时叠高亮版本 -->
          <button id="btn-char-create" class="cf-plaque plq-new" title="新建角色"></button>
          <button id="btn-char-delete" class="cf-plaque plq-del" title="删除角色"></button>
          <button id="btn-char-ok" class="cf-plaque plq-ok" title="进入游戏"></button>

          <div id="char-list" class="char-list"></div>
          <div class="panel-msg" id="char-msg"></div>
          <!-- 原版没有「回登录」，网页端要留一个出口；放在底框左侧，不挡銘牌 -->
          <button id="btn-back" class="cf-back">返回登录</button>

          <!-- 新建角色面板（原版贴图；默认隐藏） -->
          <div id="create-panel" class="hidden">
            <div class="cp-art cp-top" id="cp-art-top"></div>
            <div class="cp-art cp-bottom" id="cp-art-bottom"></div>
            <img id="create-preview" class="cp-preview" alt="" />
            <input id="create-name" class="cp-name" maxlength="10" spellcheck="false" autocomplete="off" />
            <div class="cp-class" id="create-class">魔法师</div>
            <button class="cp-hot cp-prev" id="cp-prev" title="上一个职业"></button>
            <button class="cp-hot cp-next" id="cp-next" title="下一个职业"></button>
            <button class="cp-hot cp-ok" id="cp-ok" title="创建"></button>
            <button class="cp-hot cp-cancel" id="cp-cancel" title="取消"></button>
            <div class="cp-msg" id="create-msg"></div>
          </div>
        </div>
      </div>

      <!--
        启动画面 —— 原版 `Scene_Intro`（0x005137A0）：
          Local/Webzenlogo.ozj  256×195，在 (192,142.5) 正中
          Local/Everyone.OZJ    120×60，在 (520,0) 右上角
        这一屏只是盖住网页端的首屏加载（原版一帧就过），1.6s 后淡出。
      -->
      <div id="intro" class="hidden">
        <div class="mu-layer" id="intro-layer">
          <div class="intro-logo" id="intro-logo"></div>
          <div class="intro-esrb" id="intro-esrb"></div>
        </div>
      </div>

      <!-- 载入进度 —— 原版 `Scene_Loading` 的三张 Loading 横排 + 一条网页端才有的进度条 -->
      <div id="loading" class="hidden">
        <div class="mu-layer" id="loading-layer">
          <div class="ld-tile" id="ld-t1"></div>
          <div class="ld-tile" id="ld-t2"></div>
          <div class="ld-tile" id="ld-t3"></div>
          <div class="ld-bar"><div class="fill" id="loading-fill"></div></div>
          <div class="msg" id="loading-msg">正在初始化…</div>
          <button id="btn-cancel-load" class="ghost small">取消</button>
        </div>
      </div>

      <!--
        界面。
        角色名 / 坐标 / HP / MP / AG / 经验 全部搬到原版底栏里去了
        （src/ui/hudValues.ts，640×480 逻辑坐标），这里只留调试信息与操作提示。
      -->
      <div id="hud" class="hidden">
        <div class="hud-top-right">
          <div id="stat-fps">-- FPS</div>
          <div id="stat-pos">--</div>
          <div id="stat-ents">--</div>
          <!-- 原版是「选项菜单」里的 MusicOnOff 开关（注册表），网页端放这里 -->
          <button id="btn-audio" class="stat-btn" type="button">声音 开</button>
        </div>

        <div class="hud-top-center">
          <div id="target" class="target hidden">
            <div class="target-name" id="target-name">--</div>
            <div class="target-bar"><div class="target-fill" id="target-fill"></div></div>
          </div>
        </div>

        <div class="hud-bottom-right">
          <div class="key-row"><b>左键</b> 移动 / 点击怪物攻击 / 点击地面物品拾取</div>
          <div class="key-row"><b>WASD</b> 移动　<b>空格</b> 攻击最近目标　<b>G</b> 拾取脚下</div>
          <div class="key-row"><b>C</b> 角色属性　<b>I</b> 背包　<b>右键拖拽</b> 转视角　<b>Esc</b> 系统菜单</div>
          <div class="key-row"><b>P</b> 显隐右上角「角色 / 装备」面板（离线演示）</div>
        </div>
      </div>

      <!-- 伤害飘字层 -->
      <div id="fx"></div>
    </div>

  </body>
</html>
